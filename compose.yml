#=====================================================================
# weathertw 실행 정의.  로컬과 서버가 이 파일 하나를 같이 쓴다.
#
#   켜기 :  docker compose up -d
#   로그 :  docker compose logs -f mysql
#   끄기 :  docker compose down          (볼륨은 남는다 = DB 데이터 보존)
#   상태 :  docker compose ps
#
# 비밀번호는 여기 적지 않는다. 같은 폴더의 .env 에서 읽는다(gitignore).
# application.yml 과 application-secret.yml 의 관계와 같다.
#=====================================================================

services:

  mysql:
    # 8.0 으로 고정한다. 그냥 "8" 로 두면 최근에 8.4 가 받아져서
    # 로컬 개발 환경(8.0.22)과 메이저 버전이 갈린다.
    # 8.0.x 안에서는 보안 패치를 계속 받는다.
    image: mysql:8.0
    container_name: wt-mysql
    # 도커 데스크톱을 껐다 켜도 알아서 다시 뜬다. 배포 상태를 유지하려면 필요하다.
    restart: unless-stopped

    ports:
      # 왼쪽이 내 PC, 오른쪽이 컨테이너 안.
      # 3306 은 윈도우에 설치된 MySQL80 이 이미 잡고 있어서 호스트 쪽만 3307 로 뺀다.
      # 나중에 앱 컨테이너는 이 포트를 안 거치고 컨테이너끼리 mysql:3306 으로 직접 붙는다.
      - "3307:3306"

    environment:
      # mysql 이미지가 최초 기동 때 이 값들을 읽어 DB 와 계정을 자동으로 만든다.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul

    # weatherregion 의 한글 지역명이 깨지지 않게 서버 기본 문자셋을 맞춘다.
    # (덤프 파일이 utf8mb4 라 서버도 같아야 한다)
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci

    volumes:
      # ① 이름 붙인 볼륨 - 도커가 관리한다. 컨테이너를 지워도 DB 데이터는 남는다.
      - mysql-data:/var/lib/mysql
      # ② 바인드 마운트 - 내 PC 폴더를 컨테이너 안에 꽂는다.
      #    mysql 이미지는 최초 기동 때 이 폴더의 .sql 을 이름순으로 실행한다.
      #    01-weatherregion.sql 의 3,526행이 여기서 자동으로 들어간다.
      #    ⚠ 볼륨(①)이 비어 있을 때 딱 한 번만 돈다. 다시 태우려면 볼륨을 지워야 한다.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro

    healthcheck:
      # 나중에 앱 컨테이너가 depends_on 으로 "MySQL 이 진짜 준비될 때까지" 기다리게 한다.
      # 단순히 컨테이너가 떴는지가 아니라 접속을 받을 수 있는지를 본다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 초기화(DB 생성 + 3,526행 적재)에 시간이 걸린다. 그동안은 실패로 세지 않는다.
      start_period: 60s


  redis:
    # 7.4 로 고정. alpine 은 용량이 작은 리눅스 베이스라 이미지가 40MB 정도다.
    image: redis:7.4-alpine
    container_name: wt-redis
    restart: unless-stopped

    ports:
      # 호스트의 6379 는 윈도우에 설치된 redis-server 가 이미 쓰고 있어서 6380 으로 뺀다.
      # mysql 을 3307 로 뺀 것과 같은 이유다.
      # 앱 컨테이너는 이 포트를 안 거치고 컨테이너끼리 redis:6379 로 직접 붙는다.
      - "6380:6379"

    environment:
      # 아래 command 와 healthcheck 가 이 값을 쓴다.
      REDIS_PASSWORD: ${REDIS_PASSWORD}

    # mysql 이미지와 달리 redis 이미지는 환경변수로 비밀번호를 못 받는다.
    # 서버 실행 옵션으로 직접 넘겨야 한다.
    #   --requirepass : 비번 없이는 어떤 명령도 거부한다
    #   --appendonly  : 명령을 파일에 계속 덧붙여 기록한다. 컨테이너를 껐다 켜도
    #                   캐시/인증코드가 날아가지 않는다(redis 는 기본이 메모리뿐).
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]

    volumes:
      # appendonly 가 쓰는 파일이 여기 쌓인다. 이름 붙인 볼륨이라 컨테이너를 지워도 남는다.
      - redis-data:/data

    healthcheck:
      # mysqladmin ping 과 같은 역할. 살아 있으면 PONG 이 돌아온다.
      # 비번을 걸었으므로 -a 로 인증까지 해야 진짜 "쓸 수 있는" 상태인지 확인된다.
      # $$ 는 compose 가 아니라 컨테이너 안 셸이 풀어야 할 변수라는 표시다.
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      # mysql 과 달리 적재할 초기 데이터가 없어서 금방 뜬다.
      start_period: 10s

  app:
    # 앞의 둘과 결정적으로 다른 점: image 를 받아오는 게 아니라 내가 만든다.
    # context 가 빌드 기준 폴더다. 그 안의 Dockerfile 과 .dockerignore 를 쓴다.
    build:
      context: ./reactboot
    # 빌드 결과에 붙일 이름표. 나중에 서버로 옮길 때 이 이름으로 내보낸다.
    image: weathertw-app:latest
    container_name: wt-app
    restart: unless-stopped

    # 여기가 healthcheck 를 달아둔 이유다.
    # service_started 였다면 "컨테이너가 떴다" 만 보고 바로 앱을 띄워서,
    # MySQL 이 아직 접속을 안 받는 사이에 앱이 죽는다.
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      # 호스트 쪽은 9081. 8081/8082 는 윈도우가 예약해둔 대역(8048-8147)이라 바인딩이 거부된다.
      #   확인: netsh interface ipv4 show excludedportrange protocol=tcp
      # 컨테이너 안은 그대로 8081 이다.
      - "9081:8081"

    environment:
      # 운영 설정으로 켠다. 빠뜨리면 스택트레이스가 그대로 응답에 실려 나간다.
      SPRING_PROFILES_ACTIVE: prod

      # ⚠ 3307 / 6380 이 아니다. 저건 "내 PC → 컨테이너" 통로고,
      #    컨테이너끼리는 서비스 이름을 호스트명처럼 써서 내부 네트워크로 직접 붙는다.
      #    compose 가 이 이름들을 DNS 에 자동 등록해준다.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      # 어제 고친 Redisconfig 가 이 값을 실제로 쓰는지 여기서 판가름난다.
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      # prod 프로파일에서는 기본값이 없다. 안 주면 부팅이 실패한다(일부러 그렇게 뒀다).
      UPLOAD_PUBLIC_DIR: /opt/weathertw/uploads

      # 도메인을 사면 이 셋을 https://... 로 바꾼다. .env 에 적으면 그 값이 우선한다.
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:9081}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3001}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS:-http://localhost:3001}

    volumes:
      # 나머지 시크릿(메일·구글·네이버·JWT·기상청)은 이 파일 하나로 넘긴다.
      # 이미지에는 안 들어가고(.dockerignore) 실행할 때만 꽂힌다.
      # application.yml 의 config.import 가 작업폴더(/app)에서 이 이름을 찾는다.
      - ./reactboot/application-secret.yml:/app/application-secret.yml:ro
      # 업로드된 프로필 이미지. 컨테이너를 새로 만들어도 남아야 하므로 이름 붙인 볼륨.
      - upload-data:/opt/weathertw/uploads

    healthcheck:
      # 이 이미지에는 curl 도 wget 도 없다. 대신 bash 의 /dev/tcp 로 포트가
      # 열렸는지만 본다. 스프링은 톰캣이 뜬 뒤에야 포트를 열기 때문에
      # "부팅이 끝났다" 와 사실상 같은 뜻이다.
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8081' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # 스프링 부팅에 20~40초 걸린다. 그동안의 실패는 안 센다.
      start_period: 60s
volumes:
  # 이름만 적어두면 도커가 알아서 만든다.
  # 실제 이름은 폴더명이 앞에 붙어 backend_mysql-data 가 된다.
  mysql-data:
  # redis 의 appendonly 파일. 실제 이름은 backend_redis-data 가 된다.
  redis-data:
  # 업로드된 이미지. 실제 이름은 backend_upload-data 가 된다.
  upload-data:
