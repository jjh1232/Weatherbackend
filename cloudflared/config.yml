#=====================================================================
# Named Tunnel 설정.  Quick Tunnel 과 달리 주소가 고정된다.
#
# 이 파일에는 비밀이 없다(터널 id 는 공개돼도 무해하다).
# 진짜 열쇠는 같은 폴더의 cert.pem 과 <터널id>.json 이고 둘 다 gitignore 대상이다.
#=====================================================================

# 어느 터널로 동작할지. cloudflared tunnel create weave 가 만들어준 id.
tunnel: f57dae31-33b3-48f7-b200-ca4751077d04

# 이 터널로 트래픽을 받을 자격증명. 컨테이너 안 경로다.
credentials-file: /etc/cloudflared/f57dae31-33b3-48f7-b200-ca4751077d04.json

# 들어온 요청을 어디로 흘려보낼지. 위에서부터 순서대로 검사한다.
ingress:
  # weave-api.prelaps.com 으로 온 것만 백엔드로 넘긴다.
  #   app:8081  ← 9081 이 아니다. 터널도 컨테이너라 내부 네트워크로 직접 붙는다.
  #   http 로 넘겨도 된다. 도커 내부 네트워크는 밖에서 접근할 수 없고,
  #   브라우저~Cloudflare 구간은 이미 HTTPS 다.
  - hostname: weave-api.prelaps.com
    service: http://app:8081

  # 위 어디에도 안 걸리면 404. ingress 의 마지막 줄은 hostname 없이 두는 것이 규칙이다.
  # (없으면 cloudflared 가 설정 오류로 기동을 거부한다)
  - service: http_status:404
