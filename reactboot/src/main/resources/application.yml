#  값은 저장소에 두지 않는다.
#  로컬  : reactboot/application-secret.yml  (gitignore 대상, 아래 config.import 로 읽음)
#  서버  : 환경변수 (systemd EnvironmentFile 등)
#  ${VAR}        -> 없으면 부팅 실패 (시크릿은 전부 이 형태)
#  ${VAR:기본값} -> 없으면 기본값 (시크릿 아닌 것만)

server:
  port: ${SERVER_PORT:8081}



  #ssl:
   # key-store: keystore.p12
   # key-store-password: ${SSL_KEYSTORE_PASSWORD}
   # keyStoreType: PKCS12
   # keyAlias: tomcat
  servlet:
    encoding:
      force-response: true



spring:

  # 로컬 개발용 시크릿 파일. 파일이 없어도 부팅된다(서버에서는 환경변수를 쓴다).
  config:
    import: optional:file:./application-secret.yml

  datasource:
    driver-classname: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spring5fs}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    connection-timeout:  10000
    maximum-pool-size: 10

  jpa:
   open-in-view: false # 이위치
   properties:
    default_batch_fetch_size: 1000
    hibernate:
      ddl-auto: update
    show-sql: true

  data:
   redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    type: redis



  mail:
   host: smtp.gmail.com
   port: 587
   username: ${MAIL_USERNAME}
   password: ${MAIL_PASSWORD}
   properties:
     mail:
       smtp:
         auth: true
         timeout: 5000
         starttls:
           enable: true

  security:
    oauth2:
      client:
        registration:
         google:  #/oauth2/authorization/google
           client-id: ${GOOGLE_CLIENT_ID}
           client-secret: ${GOOGLE_CLIENT_SECRET}
           scope:
           - email
           - profile
           redirect-uri: http://localhost:8081/callback/google

         naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope:
            - name
            - email

            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8081/callback/naver



        provider:
           naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response



# JWT 서명키. HS512 를 쓰므로 충분히 길어야 한다.
#  생성 예) openssl rand -base64 64
jwt:
  secret: ${JWT_SECRET}

# 기상청 단기예보 API (data.go.kr) - 일반 인증키(Encoding)
weather:
  api:
    service-key: ${WEATHER_API_KEY}
